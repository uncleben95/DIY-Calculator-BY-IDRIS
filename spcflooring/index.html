<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPC Flooring Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --tng-yellow: #fdee23; --tng-dark: #111111; --bg-color: #f4f5f7; --card-bg: #ffffff; --text-main: #111111; --text-sub: #666666; --border-color: #e4e7eb; --shadow: 0 4px 16px rgba(0, 0, 0, 0.06); }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 20px 16px 90px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 600px; width: 100%; background: var(--card-bg); padding: 25px; border-radius: 20px; box-shadow: var(--shadow); border: 1px solid var(--border-color); }
        h2 { text-align: center; color: var(--text-main); margin-top: 0; margin-bottom: 25px; font-size: 20px; font-weight: 800; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 13px; }
        input, select { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 10px; font-size: 14px; box-sizing: border-box; background: #fff; outline: none; }
        input:focus, select:focus { border-color: #d4b200; box-shadow: 0 0 0 3px rgba(253, 238, 35, 0.2); }
        button.calc-btn { background-color: var(--tng-yellow); color: var(--tng-dark); border: 1.5px solid #111; padding: 15px; width: 100%; font-size: 16px; font-weight: 800; border-radius: 12px; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 12px rgba(253, 238, 35, 0.3); transition: 0.2s; }
        button.calc-btn:active { transform: scale(0.98); }
        .result-box { margin-top: 25px; padding: 20px; background: #fffdf0; border-radius: 14px; border: 1.5px solid #f6e05e; display: none; font-size: 13px; }
        .result-box h3 { margin-top: 0; color: #111; font-size: 16px; border-bottom: 1px solid #e2e8f0; padding-bottom: 8px; }
        .visual-container { margin-top: 25px; padding: 15px; background: #ffffff; border: 1px solid var(--border-color); border-radius: 12px; text-align: center; display: none; }
        canvas { width: 100%; max-width: 520px; height: 240px; border: 1px solid var(--border-color); background: #fafafa; margin-top: 10px; border-radius: 8px; }
        .add-cart-main-btn { background-color: var(--tng-yellow); color: var(--tng-dark); border: 1.5px solid #111; padding: 14px; width: 100%; font-size: 15px; font-weight: 800; border-radius: 12px; cursor: pointer; margin-top: 15px; display: none; box-shadow: 0 4px 12px rgba(253, 238, 35, 0.3); transition: 0.2s;}
        .add-cart-main-btn:active { transform: scale(0.98); }
    </style>
</head>
<body>

<div class="container">
    <h2>SPC Flooring Calculator</h2>
    
    <div class="form-group">
        <label>Unit Ukuran:</label>
        <select id="unitUkuran">
            <option value="mm">Milimeter (mm)</option>
            <option value="ft">Kaki (ft)</option>
        </select>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
        <div class="form-group">
            <label>Lebar Ruang:</label>
            <input type="number" id="lebarLantai" value="3000">
        </div>
        <div class="form-group">
            <label>Panjang Ruang:</label>
            <input type="number" id="panjangLantai" value="4000">
        </div>
    </div>

    <div class="form-group">
        <label>Pilihan Jenis Lantai SPC:</label>
        <select id="jenisSPC">
            <option value="ecoflex">SPC Ecoflex 4mm (24 sqft/kotak | RM90)</option>
            <option value="microcement">SPC Microcement (20 sqft/kotak | RM110)</option>
            <option value="herringbone">SPC Herringbone (16 sqft/kotak | RM130)</option>
        </select>
    </div>

    <div class="form-group">
        <label>Wastage / Lebihan (%):</label>
        <select id="wastagePerc">
            <option value="5">5% (Standard)</option>
            <option value="10" selected>10% (Disyorkan)</option>
            <option value="15">15% (Banyak Potongan)</option>
        </select>
    </div>

    <button class="calc-btn" onclick="kirimKiraSPC()">Kira Sekarang & Visual</button>
    
    <div class="result-box" id="resultBox">
        <h3>Pecahan Sebut Harga SPC:</h3>
        <div id="spcBreakdown" style="line-height: 1.6; margin-bottom: 10px;"></div>
        <div style="border-top: 1px solid #e2e8f0; margin: 10px 0;"></div>
        <div style="display: flex; justify-content: space-between; font-size: 15px; font-weight: 800;">
            <span>JUMLAH KESELURUHAN:</span>
            <span id="jumlahHarga" style="color: #111;">-</span>
        </div>
        <button class="add-cart-main-btn" id="addCartBtn" onclick="addSPCToCart()">+ Masukkan ke Troli (Cart)</button>
    </div>

    <!-- Kotak Visual Canvas -->
    <div class="visual-container" id="visualBox">
        <h3 style="font-size: 14px; margin-top: 0;">Anggaran Susun Atur Lantai</h3>
        <canvas id="canvasVisual"></canvas>
    </div>
</div>

<script>
    // Data Harga Standard
    const spcData = {
        ecoflex: { name: "SPC Ecoflex", sqft: 24, price: 90 },
        microcement: { name: "SPC Microcement", sqft: 20, price: 110 },
        herringbone: { name: "SPC Herringbone", sqft: 16, price: 130 }
    };

    let lastCalculatedRecord = null;

    function kirimKiraSPC() {
        let unit = document.getElementById('unitUkuran').value;
        let w = parseFloat(document.getElementById('lebarLantai').value) || 0;
        let l = parseFloat(document.getElementById('panjangLantai').value) || 0;
        let jenis = document.getElementById('jenisSPC').value;
        let wastage = parseFloat(document.getElementById('wastagePerc').value) || 0;

        if (w <= 0 || l <= 0) { alert("Sila masukkan ukuran yang sah!"); return; }

        // Tukar ukuran kepada sqft
        let areaSqft = 0;
        let perimeterFt = 0;
        if (unit === 'mm') {
            areaSqft = (w / 304.8) * (l / 304.8);
            perimeterFt = ((w / 304.8) + (l / 304.8)) * 2;
        } else {
            areaSqft = w * l;
            perimeterFt = (w + l) * 2;
        }

        let totalSqft = areaSqft * (1 + (wastage / 100));
        
        let selectedSPC = spcData[jenis];
        let kotakDiperlukan = Math.ceil(totalSqft / selectedSPC.sqft);
        let hargaLantai = kotakDiperlukan * selectedSPC.price;

        // Skirting estimate (8ft per batang)
        let skirtingBtg = Math.ceil(perimeterFt / 8);
        let hargaSkirting = skirtingBtg * 25; // Andaikan RM25 sebatang
        
        let grandTotal = hargaLantai + hargaSkirting;

        document.getElementById('resultBox').style.display = "block";
        document.getElementById('addCartBtn').style.display = "block";

        document.getElementById('spcBreakdown').innerHTML = `
            Keluasan Asal: <b>${areaSqft.toFixed(2)} sqft</b><br>
            Termasuk Wastage (${wastage}%): <b>${totalSqft.toFixed(2)} sqft</b><br><br>
            1. ${selectedSPC.name} (${selectedSPC.sqft} sqft/kotak)<br>
            &nbsp;&nbsp;&nbsp;➡ ${kotakDiperlukan} Kotak x RM ${selectedSPC.price} = <b style="color:#111;">RM ${hargaLantai.toFixed(2)}</b><br>
            2. Anggaran Skirting PVC (8ft/btg)<br>
            &nbsp;&nbsp;&nbsp;➡ ${skirtingBtg} Btg x RM 25 = <b style="color:#111;">RM ${hargaSkirting.toFixed(2)}</b>
        `;
        
        document.getElementById('jumlahHarga').innerText = `RM ${grandTotal.toFixed(2)}`;

        lastCalculatedRecord = {
            tajuk: "SPC Flooring",
            info: `${w}x${l}${unit} (${selectedSPC.name})`,
            harga: "RM " + grandTotal.toFixed(2)
        };

        // Paparkan dan lukis visual
        document.getElementById('visualBox').style.display = "block";
        lukisVisualSPC(w, l, unit);
    }

    function lukisVisualSPC(w, l, unit) {
        let canvas = document.getElementById("canvasVisual");
        let ctx = canvas.getContext("2d");
        
        canvas.width = canvas.parentElement.clientWidth - 30; 
        canvas.height = 240;
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Setup skala lukisan (Aspect Ratio)
        let scale = Math.min((canvas.width - 40) / w, (canvas.height - 40) / l);
        let drawW = w * scale;
        let drawH = l * scale;
        let startX = (canvas.width - drawW) / 2;
        let startY = (canvas.height - drawH) / 2;

        // Warna Latar Lantai
        ctx.fillStyle = "#fff8b0"; // Kuning kayu cair
        ctx.fillRect(startX, startY, drawW, drawH);
        
        // Lukis Garisan Corak Lantai (Planks)
        ctx.strokeStyle = "#d4b200";
        ctx.lineWidth = 1;
        
        let plankW_px = drawW / 10;
        let plankH_px = drawH / 20;

        for (let i = 0; i <= drawW; i += plankW_px) {
            ctx.beginPath();
            ctx.moveTo(startX + i, startY);
            ctx.lineTo(startX + i, startY + drawH);
            ctx.stroke();
        }
        
        for (let i = 0; i < drawW; i += plankW_px) {
            let offset = (Math.random() > 0.5) ? (plankH_px / 2) : 0;
            for (let j = offset; j < drawH; j += plankH_px) {
                ctx.beginPath();
                ctx.moveTo(startX + i, startY + j);
                ctx.lineTo(startX + i + plankW_px, startY + j);
                ctx.stroke();
            }
        }

        // Bingkai Luar Bilik (Skirting)
        ctx.strokeStyle = "#111"; 
        ctx.lineWidth = 4; 
        ctx.strokeRect(startX, startY, drawW, drawH);
    }

    function addSPCToCart() {
        if (!lastCalculatedRecord) { alert("Sila buat pengiraan terlebih dahulu!"); return; }
        
        let c = JSON.parse(localStorage.getItem('diy_cart')) || []; 
        c.push(lastCalculatedRecord); 
        localStorage.setItem('diy_cart', JSON.stringify(c));

        let h = JSON.parse(localStorage.getItem('diy_calc_history')) || []; 
        h.push(lastCalculatedRecord); 
        localStorage.setItem('diy_calc_history', JSON.stringify(h));

        alert("Berjaya masukkan pengiraan SPC ke dalam Troli!");
    }
</script>

<a href="../index.html" style="position: fixed; bottom: 20px; right: 20px; background: #fdee23; color: #111; padding: 12px 18px; border-radius: 30px; text-decoration: none; font-weight: 800; font-size: 14px; box-shadow: 0 4px 15px rgba(253,238,35,0.4); display: flex; align-items: center; gap: 6px; border: 1px solid #111;">
    <span>←</span> Menu Utama
</a>
<script>
    history.pushState(null, null, location.href);
    window.addEventListener('popstate', function () { window.location.href = '../index.html'; });
</script>

</body>
</html>
