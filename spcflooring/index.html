<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPC Flooring Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --tng-yellow: #fdee23; --tng-dark: #111111; --bg-color: #f4f5f7; --card-bg: #ffffff; --text-main: #111111; --text-sub: #666666; --border-color: #e4e7eb; --shadow: 0 4px 16px rgba(0, 0, 0, 0.06); }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 20px 16px 90px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 600px; width: 100%; background: var(--card-bg); padding: 25px; border-radius: 20px; box-shadow: var(--shadow); border: 1px solid var(--border-color); }
        h2 { text-align: center; color: var(--text-main); margin-top: 0; margin-bottom: 25px; font-size: 20px; font-weight: 800; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 13px; }
        input, select { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 10px; font-size: 14px; box-sizing: border-box; background: #fff; outline: none; }
        input:focus, select:focus { border-color: #d4b200; box-shadow: 0 0 0 3px rgba(253, 238, 35, 0.2); }
        button.calc-btn { background-color: var(--tng-yellow); color: var(--tng-dark); border: 1.5px solid #111; padding: 15px; width: 100%; font-size: 16px; font-weight: 800; border-radius: 12px; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 12px rgba(253, 238, 35, 0.3); transition: 0.2s; }
        button.calc-btn:active { transform: scale(0.98); }
        .result-box { margin-top: 25px; padding: 20px; background: #fffdf0; border-radius: 14px; border: 1.5px solid #f6e05e; display: none; font-size: 13px; }
        .result-box h3 { margin-top: 0; color: #111; font-size: 16px; border-bottom: 1px solid #e2e8f0; padding-bottom: 8px; }
        .visual-container { margin-top: 25px; padding: 15px; background: #ffffff; border: 1px solid var(--border-color); border-radius: 12px; text-align: center; display: none; }
        canvas { width: 100%; max-width: 520px; height: 240px; border: 1px solid var(--border-color); background: #fafafa; margin-top: 10px; border-radius: 8px; }
        .add-cart-main-btn { background-color: var(--tng-yellow); color: var(--tng-dark); border: 1.5px solid #111; padding: 14px; width: 100%; font-size: 15px; font-weight: 800; border-radius: 12px; cursor: pointer; margin-top: 15px; display: none; box-shadow: 0 4px 12px rgba(253, 238, 35, 0.3); transition: 0.2s; }
        .add-cart-main-btn:active { transform: scale(0.98); }
    </style>
</head>
<body>

<div class="container">
    <h2>SPC Flooring Calculator</h2>
    
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
        <div class="form-group">
            <label>Lebar Ruang (mm):</label>
            <input type="number" id="roomWidth" value="3000">
        </div>
        <div class="form-group">
            <label>Panjang Ruang (mm):</label>
            <input type="number" id="roomLength" value="5000">
        </div>
    </div>

    <div class="form-group">
        <label>Pilihan Jenis SPC:</label>
        <select id="spcType">
            <option value="ecoflex">Ecoflex (RM98/box | Cover: 21.6 sqft)</option>
            <option value="microcement">Microcement (RM138/box | Cover: 24 sqft)</option>
            <option value="herringbone">Herringbone (RM128/box | Cover: 20.25 sqft)</option>
        </select>
    </div>

    <div class="form-group">
        <label>Pilihan Aksesori Tambahan:</label>
        <select id="accessoryType">
            <option value="skirting">Skirting PVC (RM23/btg)</option>
            <option value="endcap">End Cap / Edge Profile (RM25/btg)</option>
            <option value="tmolding">T-Molding / Transition (RM30/btg)</option>
            <option value="none">Tiada Aksesori Tambahan</option>
        </select>
    </div>

    <div class="form-group">
        <label>Wastage / Lebihan (%):</label>
        <select id="wastagePerc">
            <option value="5" selected>5% (Standard)</option>
            <option value="10">10% (Disyorkan)</option>
            <option value="15">15% (Banyak Potongan)</option>
        </select>
    </div>

    <button class="calc-btn" onclick="calculateSPC()">Kira Sebut Harga & Visual</button>
    
    <div class="result-box" id="resultBox">
        <h3>Pecahan Sebut Harga SPC:</h3>
        <div id="resultContent" style="line-height: 1.6; margin-bottom: 10px;"></div>
        <div style="border-top: 1px solid #e2e8f0; margin: 10px 0;"></div>
        <div style="display: flex; justify-content: space-between; font-size: 15px; font-weight: 800;">
            <span>JUMLAH KESELURUHAN:</span>
            <span id="jumlahHarga" style="color: #111;">-</span>
        </div>
        <button class="add-cart-main-btn" id="addCartBtn" onclick="addSPCToCart()">+ Masukkan ke Troli (Cart)</button>
    </div>

    <div class="visual-container" id="visualBox">
        <h3 id="visualTitle" style="font-size: 14px; margin-top: 0;">Lakaran Susun Atur Lantai</h3>
        <canvas id="canvasVisual"></canvas>
    </div>
</div>

<script>
    let lastCalculatedRecord = null;

    function calculateSPC() {
        let type = document.getElementById('spcType').value;
        let accType = document.getElementById('accessoryType').value;
        let wastage = parseFloat(document.getElementById('wastagePerc').value) || 5;
        let wMm = parseFloat(document.getElementById('roomWidth').value) || 0;
        let lMm = parseFloat(document.getElementById('roomLength').value) || 0;

        if (wMm <= 0 || lMm <= 0) { alert('Sila masukkan ukuran ruang yang sah.'); return; }

        let sqftArea = (wMm / 304.8) * (lMm / 304.8);
        let adjustedSqft = sqftArea * (1 + (wastage / 100));
        let boxCount = 0, spcCost = 0, name = "";

        if (type === 'ecoflex') { boxCount = Math.ceil(adjustedSqft / 21.6); spcCost = boxCount * 98; name = "Ecoflex"; }
        else if (type === 'microcement') { boxCount = Math.ceil(adjustedSqft / 24); spcCost = boxCount * 138; name = "Microcement"; }
        else if (type === 'herringbone') { boxCount = Math.ceil(adjustedSqft / 20.25); spcCost = boxCount * 128; name = "Herringbone"; }

        // Kira Aksesori (Anggaran perimeter keliling ruang / batang standard 8 kaki atau 2.4 meter)
        let perimeterMeters = (2 * (wMm + lMm)) / 1000;
        let accSticks = Math.ceil(perimeterMeters / 2.4);
        let accPrice = 0, accName = "";

        if (accType === 'skirting') { accPrice = 23; accName = "Skirting PVC"; }
        else if (accType === 'endcap') { accPrice = 25; accName = "End Cap Profile"; }
        else if (accType === 'tmolding') { accPrice = 30; accName = "T-Molding Profile"; }

        let accTotalCost = (accType !== 'none') ? (accSticks * accPrice) : 0;
        let grandTotal = spcCost + accTotalCost;

        document.getElementById('resultBox').style.display = 'block';
        document.getElementById('addCartBtn').style.display = 'block';
        document.getElementById('visualBox').style.display = 'block';

        let html = `
            Keluasan Asal: <b>${sqftArea.toFixed(1)} sqft</b> (Wastage: ${wastage}%)<br>
            • <b>${boxCount} Kotak ${name}</b> = RM ${spcCost.toFixed(2)}<br>
        `;
        if (accType !== 'none') {
            html += `• <b>${accSticks} btg ${accName}</b> ( @RM${accPrice} ) = RM ${accTotalCost.toFixed(2)}<br>`;
        }
        
        document.getElementById('resultContent').innerHTML = html;
        document.getElementById('jumlahHarga').innerText = `RM ${grandTotal.toFixed(2)}`;

        lastCalculatedRecord = { 
            tajuk: `SPC Flooring (${name})`, 
            info: `${wMm}x${lMm}mm`, 
            harga: "RM " + grandTotal.toFixed(2) 
        };

        // Lakaran Visual Canvas
        let canvas = document.getElementById("canvasVisual");
        let ctx = canvas.getContext("2d");
        canvas.width = canvas.parentElement.clientWidth - 30; canvas.height = 220;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        let scale = Math.min((canvas.width - 40) / wMm, (canvas.height - 40) / lMm);
        let drawW = wMm * scale, drawH = lMm * scale;
        let startX = (canvas.width - drawW) / 2, startY = (canvas.height - drawH) / 2;

        ctx.fillStyle = "#fff8b0"; ctx.fillRect(startX, startY, drawW, drawH);
        ctx.strokeStyle = "#111"; ctx.lineWidth = 3; ctx.strokeRect(startX, startY, drawW, drawH);

        if (type === 'herringbone') {
            ctx.strokeStyle = "#b89b00"; ctx.lineWidth = 1;
            let step = 16;
            for (let x = -drawH; x < drawW + drawH; x += step) {
                ctx.beginPath(); ctx.moveTo(startX + x, startY); ctx.lineTo(startX + x + drawH/2, startY + drawH/2); ctx.lineTo(startX + x, startY + drawH); ctx.stroke();
            }
        } else {
            ctx.strokeStyle = "#d4b200"; ctx.lineWidth = 1;
            let pW = drawW / 6, pH = drawH / 12;
            for (let y = 0; y < drawH; y += pH) {
                ctx.beginPath(); ctx.moveTo(startX, startY + y); ctx.lineTo(startX + drawW, startY + y); ctx.stroke();
            }
            let row = 0;
            for (let y = 0; y < drawH; y += pH) {
                let off = (row % 2 === 0) ? 0 : (pW / 2);
                for (let x = off; x <= drawW; x += pW) {
                    ctx.beginPath(); ctx.moveTo(startX + x, startY + y); ctx.lineTo(startX + x, startY + y + pH); ctx.stroke();
                }
                row++;
            }
        }
    }

    function addSPCToCart() {
        if (!lastCalculatedRecord) return;
        let c = JSON.parse(localStorage.getItem('diy_cart')) || []; 
        c.push(lastCalculatedRecord); 
        localStorage.setItem('diy_cart', JSON.stringify(c));

        let h = JSON.parse(localStorage.getItem('diy_calc_history')) || []; 
        h.push(lastCalculatedRecord); 
        localStorage.setItem('diy_calc_history', JSON.stringify(h));

        alert("Berjaya masukkan ke Troli!");
    }
</script>

<a href="../index.html" style="position: fixed; bottom: 20px; right: 20px; background: #fdee23; color: #111; padding: 12px 18px; border-radius: 30px; text-decoration: none; font-weight: 800; font-size: 14px; border: 1px solid #111;"><span>←</span> Menu Utama</a>
</body>
</html>
