<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ceiling Series Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --tng-yellow: #fdee23; --tng-dark: #111111; --bg-color: #f4f5f7; --card-bg: #ffffff; --text-main: #111111; --text-sub: #666666; --border-color: #e4e7eb; --shadow: 0 4px 16px rgba(0, 0, 0, 0.06); }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 20px 16px 90px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 600px; width: 100%; background: var(--card-bg); padding: 25px; border-radius: 20px; box-shadow: var(--shadow); border: 1px solid var(--border-color); }
        h1 { text-align: center; color: var(--text-main); font-size: 20px; font-weight: 800; margin-top: 0; margin-bottom: 25px; }
        .form-grid { display: grid; grid-template-columns: 1fr; gap: 16px; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; }
        label { font-weight: 600; margin-bottom: 6px; font-size: 13px; }
        select, input { padding: 12px; border: 1px solid var(--border-color); border-radius: 10px; font-size: 14px; outline: none; background: #fff; }
        button.calc-btn { background-color: var(--tng-yellow); color: var(--tng-dark); border: 1.5px solid #111; padding: 15px; font-size: 16px; font-weight: 800; border-radius: 12px; cursor: pointer; width: 100%; box-shadow: 0 4px 12px rgba(253, 238, 35, 0.3); }
        .result-section { margin-top: 25px; border-top: 2px solid var(--border-color); padding-top: 20px; }
        .result-card { background: #fffdf0; padding: 16px; border-radius: 12px; margin-bottom: 15px; border: 1.5px solid #f6e05e; font-size: 13px; }
        .price-table { width: 100%; border-collapse: collapse; margin-top: 10px; background: #fff; font-size: 13px; }
        .price-table th, .price-table td { border: 1px solid var(--border-color); padding: 8px 10px; text-align: left; }
        .price-table th { background-color: #f1f5f9; }
        .visual-container { margin-top: 20px; text-align: center; background: #fff; border: 1px solid var(--border-color); border-radius: 12px; padding: 15px; }
        canvas { width: 100%; max-width: 520px; height: 240px; border: 1px solid var(--border-color); background: #fafafa; margin-top: 10px; border-radius: 8px; }
        .add-cart-main-btn { background-color: var(--tng-yellow); color: var(--tng-dark); border: 1.5px solid #111; padding: 14px; width: 100%; font-size: 15px; font-weight: 800; border-radius: 12px; cursor: pointer; margin-top: 15px; display: none; }
    </style>
</head>
<body>
<div class="container">
    <h1>Ceiling Series Calculator</h1>
    <div class="form-grid">
        <div class="form-group">
            <label>Pilih Jenis Ceiling:</label>
            <select id="seriesType" onchange="toggleSoffitSubtype()">
                <option value="pvc_300">PVC Ceiling (300mm)</option>
                <option value="soffit_a">Soffit A (340mm)</option>
                <option value="soffit_f">Soffit F (190mm)</option>
            </select>
        </div>
        <div class="form-group" id="subtypeGroup" style="display: none;">
            <label>Kategori Soffit A:</label>
            <select id="soffitSubtype">
                <option value="internal">Internal</option>
                <option value="external">External</option>
            </select>
        </div>
        <div class="form-group"><label>Lebar Ruang (mm):</label><input type="number" id="roomWidth" value="3000"></div>
        <div class="form-group"><label>Panjang Ruang (mm):</label><input type="number" id="roomLength" value="6000"></div>
    </div>
    <button class="calc-btn" onclick="calculateCeiling()">Kira Pengiraan & Harga Optimum</button>
    <div class="result-section" id="resultSection" style="display: none;">
        <div class="result-card">
            <h3>Hasil Pengiraan & Anggaran Kos</h3>
            <div id="resultText"></div>
            <button class="add-cart-main-btn" id="addCartBtn" onclick="addCeilingToCart()">+ Masukkan ke Troli (Cart)</button>
        </div>
        <div class="visual-container">
            <h3 style="font-size: 14px; margin-top:0;">Visualisasi Siling & Sambungan (Dotted)</h3>
            <canvas id="canvasCeiling"></canvas>
        </div>
    </div>
</div>

<script>
    const pricingData = {
        pvc_300: { width: 300, lengths: { 5500: 57.60, 6400: 67.20 }, accessoryName: "U Clip", accessoryPrice: 32.00 },
        soffit_a_internal: { width: 340, lengths: { 5500: 90.00, 6400: 110.00 }, accessoryName: "End Cap", accessoryPrice: 50.00 },
        soffit_a_external: { width: 340, lengths: { 5500: 115.00, 6400: 125.00 }, accessoryName: "End Cap", accessoryPrice: 60.00 },
        soffit_f: { width: 190, lengths: { 5500: 85.00, 6400: 105.00 }, accessoryName: "End Cap", accessoryPrice: 50.00 }
    };

    function toggleSoffitSubtype() {
        let type = document.getElementById('seriesType').value;
        document.getElementById('subtypeGroup').style.display = (type === 'soffit_a') ? 'flex' : 'none';
    }

    let lastCalculatedRecord = null;

    function calculateCeiling() {
        let type = document.getElementById('seriesType').value;
        let sub = document.getElementById('soffitSubtype').value;
        let roomW = parseFloat(document.getElementById('roomWidth').value) || 0;
        let roomL = parseFloat(document.getElementById('roomLength').value) || 0;

        if (!roomW || !roomL) { alert('Sila masukkan ukuran ruang yang sah.'); return; }

        let key = (type === 'soffit_a') ? `soffit_a_${sub}` : type;
        let prof = pricingData[key];
        let panelW = prof.width;

        // Penilaian minimum wastage untuk saiz 5500 dan 6400 (Melintang & Menegak)
        let candidates = [];
        [5500, 6400].forEach(lenOption => {
            let pricePerPcs = prof.lengths[lenOption];
            
            // Arah A: Melintang (Panjang selari dengan roomL)
            if (lenOption >= roomW) {
                let pcsA = Math.ceil(roomL / panelW);
                let wastageA = (lenOption - roomW) * pcsA;
                candidates.push({ orientation: 'Melintang', len: lenOption, pcs: pcsA, unitPrice: pricePerPcs, wastage: wastageA, total: pcsA * pricePerPcs });
            }

            // Arah B: Menegak (Panjang selari dengan roomW)
            if (lenOption >= roomL) {
                let pcsB = Math.ceil(roomW / panelW);
                let wastageB = (lenOption - roomL) * pcsB;
                candidates.push({ orientation: 'Menegak', len: lenOption, pcs: pcsB, unitPrice: pricePerPcs, wastage: wastageB, total: pcsB * pricePerPcs });
            }
        });

        // Jika ruang lebih besar dari saiz profil maksimum, ambil kira keperluan sambungan
        if (candidates.length === 0) {
            let defaultLen = 6400;
            let pricePerPcs = prof.lengths[defaultLen];
            let pcs = Math.ceil((roomL / panelW) * (roomW / defaultLen));
            candidates.push({ orientation: 'Melintang (Sambungan)', len: defaultLen, pcs: pcs, unitPrice: pricePerPcs, wastage: 0, total: pcs * pricePerPcs });
        }

        // Pilih calon dengan jumlah kos paling rendah / wastage paling minimum
        candidates.sort((a, b) => a.total - b.total);
        let best = candidates[0];

        let pCost = best.total;
        let accN = Math.ceil((2 * (roomW + roomL)) / 5500);
        let accCost = accN * prof.accessoryPrice;
        let grandTotal = pCost + accCost;

        document.getElementById('resultSection').style.display = 'block'; 
        document.getElementById('addCartBtn').style.display = 'block';

        let typeLabel = (type === 'soffit_a') ? `Soffit A (${sub})` : (type === 'soffit_f' ? 'Soffit F' : 'PVC 300mm');

        document.getElementById('resultText').innerHTML = `
            <strong>Pilihan Optimum: ${typeLabel} (${best.orientation})</strong><br>
            Panjang Profil Dipilih: <b>${best.len}mm</b> | Kuantiti: ${best.pcs} kpg<br>
            <table class="price-table">
                <tr><th>Komponen</th><th>Kuantiti</th><th>Jumlah</th></tr>
                <tr><td>Panel (${best.len}mm)</td><td>${best.pcs} kpg</td><td>RM ${pCost.toFixed(2)}</td></tr>
                <tr><td>Aksesori (${prof.accessoryName})</td><td>${accN} btg</td><td>RM ${accCost.toFixed(2)}</td></tr>
                <tr style="font-weight:bold;"><td colspan="2" style="text-align:right;">TOTAL:</td><td style="color:#111;">RM ${grandTotal.toFixed(2)}</td></tr>
            </table>
        `;

        lastCalculatedRecord = { 
            tajuk: `Ceiling (${typeLabel})`, 
            info: `${roomW}x${roomL}mm`, 
            harga: "RM " + grandTotal.toFixed(2) 
        };

        // --- LUKIS VISUAL DENGAN UKURAN & SAMBUNGAN DOT-DOT ---
        let canvas = document.getElementById("canvasCeiling");
        let ctx = canvas.getContext("2d");
        canvas.width = canvas.parentElement.clientWidth - 30; 
        canvas.height = 240;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        let scale = Math.min((canvas.width - 60) / roomW, (canvas.height - 60) / roomL);
        let drawW = roomW * scale, drawH = roomL * scale;
        let startX = (canvas.width - drawW) / 2 + 10, startY = (canvas.height - drawH) / 2 + 10;

        // Lakar Ruang Kotak Siling
        ctx.fillStyle = "#fffdf0"; 
        ctx.fillRect(startX, startY, drawW, drawH);
        
        ctx.strokeStyle = "#d4b200"; 
        ctx.lineWidth = 1;
        let gap = Math.max(drawH / 12, 14);
        for (let y = startY; y <= startY + drawH; y += gap) {
            ctx.beginPath(); ctx.moveTo(startX, y); ctx.lineTo(startX + drawW, y); ctx.stroke();
        }

        // Bingkai Luar Siling
        ctx.strokeStyle = "#111"; 
        ctx.lineWidth = 2; 
        ctx.strokeRect(startX, startY, drawW, drawH);

        // Jika saiz ruang melebihi panjang standard, lukis garisan dot-dot sambungan
        if (roomW > best.len || roomL > best.len) {
            ctx.strokeStyle = "#e11d48";
            ctx.lineWidth = 2;
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            if (roomW > best.len) {
                let splitX = startX + (best.len * scale);
                ctx.moveTo(splitX, startY); ctx.lineTo(splitX, startY + drawH);
            } else {
                let splitY = startY + (best.len * scale);
                ctx.moveTo(startX, splitY); ctx.lineTo(startX + drawW, splitY);
            }
            ctx.stroke();
            ctx.setLineDash([]); // Reset dash

            ctx.fillStyle = "#e11d48";
            ctx.font = "10px Inter, sans-serif";
            ctx.fillText("Garisan Sambungan Profil", startX + 5, startY + 15);
        }

        // Paparkan Label Ukuran pada Visual
        ctx.fillStyle = "#111";
        ctx.font = "11px Inter, sans-serif";
        ctx.fillText(`Lebar: ${roomW}mm`, startX + (drawW / 2) - 40, startY - 5);
        
        ctx.save();
        ctx.translate(startX - 15, startY + (drawH / 2));
        ctx.rotate(-Math.PI / 2);
        ctx.fillText(`Panjang: ${roomL}mm`, -30, 0);
        ctx.restore();
    }

    function addCeilingToCart() {
        if (!lastCalculatedRecord) return;
        let c = JSON.parse(localStorage.getItem('diy_cart')) || []; 
        c.push(lastCalculatedRecord); 
        localStorage.setItem('diy_cart', JSON.stringify(c));
        alert("Berjaya masukkan ke Troli!");
    }
</script>

<a href="../index.html" style="position: fixed; bottom: 20px; right: 20px; background: #fdee23; color: #111; padding: 12px 18px; border-radius: 30px; text-decoration: none; font-weight: 800; font-size: 14px; border: 1px solid #111;"><span>←</span> Menu Utama</a>
</body>
</html>
