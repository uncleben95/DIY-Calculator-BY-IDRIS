<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ceiling Series Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --tng-yellow: #fdee23; --tng-dark: #111111; --bg-color: #f4f5f7; --card-bg: #ffffff; --text-main: #111111; --text-sub: #666666; --border-color: #e4e7eb; --shadow: 0 4px 16px rgba(0, 0, 0, 0.06); }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 20px 16px 90px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 600px; width: 100%; background: var(--card-bg); padding: 25px; border-radius: 20px; box-shadow: var(--shadow); border: 1px solid var(--border-color); }
        h1 { text-align: center; color: var(--text-main); font-size: 20px; font-weight: 800; margin-top: 0; margin-bottom: 25px; }
        .form-grid { display: grid; grid-template-columns: 1fr; gap: 16px; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; }
        label { font-weight: 600; margin-bottom: 6px; font-size: 13px; }
        select, input { padding: 12px; border: 1px solid var(--border-color); border-radius: 10px; font-size: 14px; outline: none; background: #fff; }
        button.calc-btn { background-color: var(--tng-yellow); color: var(--tng-dark); border: 1.5px solid #111; padding: 15px; font-size: 16px; font-weight: 800; border-radius: 12px; cursor: pointer; width: 100%; box-shadow: 0 4px 12px rgba(253, 238, 35, 0.3); }
        .result-section { margin-top: 25px; border-top: 2px solid var(--border-color); padding-top: 20px; }
        .result-card { background: #fffdf0; padding: 16px; border-radius: 12px; margin-bottom: 15px; border: 1.5px solid #f6e05e; font-size: 13px; }
        .visual-container { margin-top: 20px; text-align: center; background: #fff; border: 1px solid var(--border-color); border-radius: 12px; padding: 15px; }
        canvas { width: 100%; max-width: 520px; height: 220px; border: 1px solid var(--border-color); background: #fafafa; margin-top: 10px; border-radius: 8px; }
        .add-cart-main-btn { background-color: var(--tng-yellow); color: var(--tng-dark); border: 1.5px solid #111; padding: 14px; width: 100%; font-size: 15px; font-weight: 800; border-radius: 12px; cursor: pointer; margin-top: 15px; display: none; }
    </style>
</head>
<body>
<div class="container">
    <h1>Ceiling Series Calculator</h1>
    <div class="form-grid">
        <div class="form-group"><label>Pilih Jenis Ceiling:</label><select id="seriesType"><option value="pvc_300">PVC Ceiling (300mm)</option><option value="soffit_f">Soffit F (190mm)</option></select></div>
        <div class="form-group"><label>Lebar Ruang (mm):</label><input type="number" id="roomWidth" value="3000"></div>
        <div class="form-group"><label>Panjang Ruang (mm):</label><input type="number" id="roomLength" value="5000"></div>
    </div>
    <button class="calc-btn" onclick="calculateCeiling()">Kira & Lakaran Visual</button>
    <div class="result-section" id="resultSection" style="display: none;">
        <div class="result-card">
            <h3>Hasil Pengiraan & Anggaran Kos</h3>
            <div id="resultText"></div>
            <button class="add-cart-main-btn" id="addCartBtn" onclick="addCeilingToCart()">+ Masukkan ke Troli (Cart)</button>
        </div>
        <div class="visual-container"><h3 style="font-size: 14px; margin-top:0;">Visualisasi Garis Siling</h3><canvas id="canvasCeiling"></canvas></div>
    </div>
</div>
<script>
    let lastCalculatedRecord = null;
    function calculateCeiling() {
        let w = parseFloat(document.getElementById('roomWidth').value) || 0;
        let l = parseFloat(document.getElementById('roomLength').value) || 0;
        if (!w || !l) { alert('Sila masukkan ukuran.'); return; }
        let total = 280.00;
        document.getElementById('resultSection').style.display = 'block';
        document.getElementById('addCartBtn').style.display = 'block';
        document.getElementById('resultText').innerHTML = `<b>Anggaran Siling:</b> RM ${total.toFixed(2)}`;

        let canvas = document.getElementById("canvasCeiling");
        let ctx = canvas.getContext("2d");
        canvas.width = canvas.parentElement.clientWidth - 30; canvas.height = 200;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        let scale = Math.min((canvas.width - 40) / w, (canvas.height - 40) / l);
        let drawW = w * scale, drawH = l * scale;
        let startX = (canvas.width - drawW) / 2, startY = (canvas.height - drawH) / 2;

        ctx.fillStyle = "#fffdf0"; ctx.fillRect(startX, startY, drawW, drawH);
        
        // Garis-garis panel siling selari
        ctx.strokeStyle = "#d4b200"; ctx.lineWidth = 1;
        let panelGap = 20;
        for (let y = startY; y <= startY + drawH; y += panelGap) {
            ctx.beginPath(); ctx.moveTo(startX, y); ctx.lineTo(startX + drawW, y); ctx.stroke();
        }

        ctx.strokeStyle = "#111"; ctx.lineWidth = 3; ctx.strokeRect(startX, startY, drawW, drawH);

        lastCalculatedRecord = { tajuk: "Ceiling Series", info: `${w}x${l}mm`, harga: "RM " + total.toFixed(2) };
    }
    function addCeilingToCart() {
        if (!lastCalculatedRecord) return;
        let c = JSON.parse(localStorage.getItem('diy_cart')) || []; c.push(lastCalculatedRecord); localStorage.setItem('diy_cart', JSON.stringify(c));
        alert("Berjaya masukkan ke Troli!");
    }
</script>
<a href="../index.html" style="position: fixed; bottom: 20px; right: 20px; background: #fdee23; color: #111; padding: 12px 18px; border-radius: 30px; text-decoration: none; font-weight: 800; font-size: 14px; border: 1px solid #111;"><span>←</span> Menu Utama</a>
</body>
</html>
