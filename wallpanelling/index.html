<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Board with Fluted Panelling Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --tng-yellow: #fdee23; --tng-dark: #111111; --bg-color: #f4f5f7; --card-bg: #ffffff; --text-main: #111111; --text-sub: #666666; --border-color: #e4e7eb; --shadow: 0 4px 16px rgba(0, 0, 0, 0.06); }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 20px 16px 90px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 600px; width: 100%; background: var(--card-bg); padding: 25px; border-radius: 20px; box-shadow: var(--shadow); border: 1px solid var(--border-color); }
        h2 { text-align: center; color: var(--text-main); margin-top: 0; margin-bottom: 25px; font-size: 20px; font-weight: 800; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 13px; }
        input, select { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 10px; font-size: 14px; box-sizing: border-box; background: #fff; outline: none; }
        button.calc-btn { background-color: var(--tng-yellow); color: var(--tng-dark); border: 1.5px solid #111; padding: 15px; width: 100%; font-size: 16px; font-weight: 800; border-radius: 12px; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 12px rgba(253, 238, 35, 0.3); }
        .result-box { margin-top: 25px; padding: 20px; background: #fffdf0; border-radius: 14px; border: 1.5px solid #f6e05e; display: none; font-size: 13px; }
        .visual-container { margin-top: 25px; padding: 15px; background: #ffffff; border: 1px solid var(--border-color); border-radius: 12px; text-align: center; display: none; }
        canvas { width: 100%; max-width: 520px; height: 220px; border: 1px solid var(--border-color); background: #fafafa; margin-top: 10px; border-radius: 8px; }
        .add-cart-main-btn { background-color: var(--tng-yellow); color: var(--tng-dark); border: 1.5px solid #111; padding: 14px; width: 100%; font-size: 15px; font-weight: 800; border-radius: 12px; cursor: pointer; margin-top: 15px; display: none; }
    </style>
</head>
<body>
<div class="container">
    <h2>Board with Fluted Panelling Calculator</h2>
    <div class="form-group"><label>Lebar Dinding (mm):</label><input type="number" id="lebarDinding" value="3000"></div>
    <div class="form-group"><label>Tinggi Dinding (mm):</label><input type="number" id="tinggiDinding" value="2900"></div>
    <div class="form-group">
        <label>Pilihan Jenis:</label>
        <select id="jenisFluted" onchange="toggleBoardOptions()">
            <option value="WPC">WPC Standard (160mm | RM43/btg)</option>
            <option value="Fluted-Wallboard">Fluted + Wallboard</option>
            <option value="Fluted-Wallboard-Fluted">Fluted + Wallboard + Fluted</option>
        </select>
    </div>
    <div class="form-group" id="groupJenisBoard" style="display:none;"><label>Jenis Board:</label><select id="jenisBoard"><option value="Mini">Mini Wallboard (600mm | RM150)</option><option value="BF">BF Wallboard (1200mm | RM240)</option></select></div>
    <div class="form-group" id="groupJumlahBoard" style="display:none;"><label>Bilangan Keping Board:</label><select id="jumlahBoardInput"><option value="1">1 Keping</option><option value="2">2 Keping</option><option value="3">3 Keping</option><option value="4">4 Keping</option></select></div>
    <button class="calc-btn" onclick="kirimKiraPanel()">Kira & Lakaran Visual</button>
    <div class="result-box" id="resultBox">
        <h3>Keputusan Pengiraan:</h3>
        <div id="detailPecahan"></div>
        <h3 id="jumlahHarga" style="color: #111; margin-top: 10px;">-</h3>
        <button class="add-cart-main-btn" id="addCartBtn" onclick="addWallToCart()">+ Masukkan ke Troli (Cart)</button>
    </div>
    <div class="visual-container" id="visualBox">
        <h3>Lakaran Pemisah Fluted & Board</h3>
        <canvas id="canvasVisual"></canvas>
    </div>
</div>
<script>
    function toggleBoardOptions() {
        let show = document.getElementById("jenisFluted").value.includes("Wallboard");
        document.getElementById("groupJenisBoard").style.display = show ? "block" : "none";
        document.getElementById("groupJumlahBoard").style.display = show ? "block" : "none";
    }
    let lastCalculatedRecord = null;
    function kirimKiraPanel() {
        let w = parseFloat(document.getElementById("lebarDinding").value) || 0;
        let h = parseFloat(document.getElementById("tinggiDinding").value) || 0;
        let jenis = document.getElementById("jenisFluted").value;
        let jmlBoard = parseInt(document.getElementById("jumlahBoardInput").value) || 1;
        let boardW = document.getElementById("jenisBoard").value === 'Mini' ? 600 : 1200;
        let boardPrice = document.getElementById("jenisBoard").value === 'Mini' ? 150 : 240;

        if (w <= 0 || h <= 0) { alert("Sila masukkan ukuran."); return; }

        let flutedBatang = Math.ceil(w / 160);
        let kosFluted = flutedBatang * 43;
        let kosBoard = jenis.includes("Wallboard") ? (jmlBoard * boardPrice) : 0;
        let grandTotal = kosFluted + kosBoard;

        document.getElementById("resultBox").style.display = "block";
        document.getElementById("addCartBtn").style.display = "block";
        document.getElementById("visualBox").style.display = "block";
        
        let html = `<b>Batang Fluted:</b> ${flutedBatang} btg x RM43 = RM ${kosFluted.toFixed(2)}<br>`;
        if(jenis.includes("Wallboard")) {
            html += `<b>Board:</b> ${jmlBoard} keping x RM${boardPrice} = RM ${kosBoard.toFixed(2)}<br>`;
        }
        html += `<br><b>TOTAL: RM ${grandTotal.toFixed(2)}</b>`;
        
        document.getElementById("detailPecahan").innerHTML = html;
        document.getElementById("jumlahHarga").innerText = `RM ${grandTotal.toFixed(2)}`;

        lastCalculatedRecord = { tajuk: "Wall Panelling", info: `${w}x${h}mm (${jenis})`, harga: "RM " + grandTotal.toFixed(2) };

        let canvas = document.getElementById("canvasVisual");
        let ctx = canvas.getContext("2d");
        canvas.width = canvas.parentElement.clientWidth - 30; canvas.height = 200;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        let scale = Math.min((canvas.width - 40) / w, (canvas.height - 40) / h);
        let drawW = w * scale, drawH = h * scale;
        let startX = (canvas.width - drawW) / 2, startY = 10;

        ctx.fillStyle = "#fafafa"; ctx.fillRect(startX, startY, drawW, drawH);

        if (jenis.includes("Wallboard")) {
            let totalBoardW = (boardW * jmlBoard) * scale;
            let boardStartX = startX + (drawW - totalBoardW) / 2;

            ctx.fillStyle = "#ffffff"; ctx.fillRect(boardStartX, startY, totalBoardW, drawH);
            ctx.strokeStyle = "#111"; ctx.lineWidth = 2; ctx.strokeRect(boardStartX, startY, totalBoardW, drawH);

            let singleBoardW_scaled = boardW * scale;
            for(let i=1; i<jmlBoard; i++) {
                ctx.beginPath(); ctx.moveTo(boardStartX + (i * singleBoardW_scaled), startY); ctx.lineTo(boardStartX + (i * singleBoardW_scaled), startY + drawH); ctx.stroke();
            }

            let sideW = (drawW - totalBoardW) / 2;
            if (sideW > 0) {
                ctx.fillStyle = "#fdee23"; ctx.fillRect(startX, startY, sideW, drawH);
                ctx.fillRect(boardStartX + totalBoardW, startY, sideW, drawH);
                ctx.strokeRect(startX, startY, sideW, drawH);
                ctx.strokeRect(boardStartX + totalBoardW, startY, sideW, drawH);

                ctx.strokeStyle = "#d4b200"; ctx.lineWidth = 1;
                for (let x = startX; x < startX + sideW; x += 6) {
                    ctx.beginPath(); ctx.moveTo(x, startY); ctx.lineTo(x, startY + drawH); ctx.stroke();
                }
                for (let x = boardStartX + totalBoardW; x < boardStartX + totalBoardW + sideW; x += 6) {
                    ctx.beginPath(); ctx.moveTo(x, startY); ctx.lineTo(x, startY + drawH); ctx.stroke();
                }
            }
        } else {
            ctx.fillStyle = "#fdee23"; ctx.fillRect(startX, startY, drawW, drawH);
            ctx.strokeStyle = "#d4b200"; ctx.lineWidth = 1;
            for (let x = startX; x < startX + drawW; x += 6) {
                ctx.beginPath(); ctx.moveTo(x, startY); ctx.lineTo(x, startY + drawH); ctx.stroke();
            }
        }

        ctx.strokeStyle = "#111"; ctx.lineWidth = 3; ctx.strokeRect(startX, startY, drawW, drawH);
    }
    function addWallToCart() {
        if (!lastCalculatedRecord) return;
        let c = JSON.parse(localStorage.getItem('diy_cart')) || []; c.push(lastCalculatedRecord); localStorage.setItem('diy_cart', JSON.stringify(c));
        alert("Berjaya masukkan ke Troli!");
    }
</script>
<a href="../index.html" style="position: fixed; bottom: 20px; right: 20px; background: #fdee23; color: #111; padding: 12px 18px; border-radius: 30px; text-decoration: none; font-weight: 800; font-size: 14px; border: 1px solid #111;"><span>←</span> Menu Utama</a>
</body>
</html>
