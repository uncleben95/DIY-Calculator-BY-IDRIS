<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wainscoting Calculator</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --tng-yellow: #fdee23; --tng-dark: #111111; }
        body { font-family: 'Inter', sans-serif; background-color: #f4f5f7; color: #111; }
    </style>
</head>
<body class="p-4 min-h-screen flex items-center justify-center pb-20">

    <div class="max-w-lg w-full bg-white rounded-2xl shadow-xl p-5 md:p-6 space-y-6 border border-slate-200">
        <div>
            <h2 class="text-xl md:text-2xl font-bold text-slate-900">Wainscoting Calculator</h2>
            <p class="text-xs md:text-sm text-slate-500">Sebut harga terperinci, nisbah visual tepat, & muat turun imej.</p>
        </div>

        <div class="space-y-4 text-sm">
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block font-medium text-slate-700 mb-1">Lebar Dinding (mm)</label>
                    <input type="number" id="wallWidth" value="3000" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-yellow-400">
                </div>
                <div>
                    <label class="block font-medium text-slate-700 mb-1">Tinggi Dinding (mm)</label>
                    <input type="number" id="wallHeight" value="2900" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-yellow-400">
                </div>
            </div>

            <div>
                <label class="block font-medium text-slate-700 mb-1">Gaya Susun Atur</label>
                <select id="layoutStyle" class="w-full px-3 py-2 border border-slate-300 rounded-lg bg-white">
                    <option value="with_chairrail">Dengan Chair Rail (Atas & Bawah)</option>
                    <option value="without_chairrail">Tanpa Chair Rail (Kotak Penuh Sahaja)</option>
                </select>
            </div>

            <div>
                <label class="block font-medium text-slate-700 mb-1">Pilihan Corak Kotak (Nisbah)</label>
                <select id="boxPattern" class="w-full px-3 py-2 border border-slate-300 rounded-lg bg-white font-medium text-amber-700">
                    <option value="1:1">1:1 (Lebar tolak 300mm)</option>
                    <option value="1:2:1">1:2:1 (Lebar tolak 400mm, bahagi 4)</option>
                    <option value="1:1:2:1:1">1:1:2:1:1 (Lebar tolak 600mm, bahagi 6)</option>
                    <option value="2:1:2:1:2">2:1:2:1:2 (Lebar tolak 600mm, bahagi 6)</option>
                    <option value="1:2:1:2:1">1:2:1:2:1 (Lebar tolak 600mm, bahagi 7)</option>
                    <option value="1">1 (Lebar tolak 200mm)</option>
                </select>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block font-medium text-slate-700 mb-1">Jenis Bingkai</label>
                    <select id="frameType" class="w-full px-3 py-2 border border-slate-300 rounded-lg bg-white text-xs">
                        <option value="single">Single (40mm)</option>
                        <option value="double">Double (40mm+16mm)</option>
                    </select>
                </div>
                <div>
                    <label class="block font-medium text-slate-700 mb-1">Warna Bingkai</label>
                    <select id="frameColor" class="w-full px-3 py-2 border border-slate-300 rounded-lg bg-white text-xs">
                        <option value="standard">Hitam Standard</option>
                        <option value="gold">Gold Frame (+RM5)</option>
                    </select>
                </div>
            </div>

            <button onclick="calculateWainscoting()" class="w-full bg-[#fdee23] hover:bg-[#e6d61a] text-[#111] font-extrabold py-3 rounded-lg transition shadow-md border border-slate-300">
                Kira Sebut Harga & Visual
            </button>
        </div>

        <div id="resultContainer" class="bg-amber-50/50 p-4 rounded-xl space-y-3 text-sm hidden border border-amber-200">
            <h3 class="font-bold text-slate-900 border-b pb-1">Pecahan Sebut Harga</h3>
            <div id="priceBreakdown" class="space-y-1 text-xs text-slate-600"></div>
            
            <div class="flex justify-between border-t border-slate-200 pt-2 text-base">
                <span class="font-semibold text-slate-800">Jumlah Anggaran Keseluruhan:</span>
                <span id="totalPrice" class="font-bold text-amber-900">RM 0.00</span>
            </div>
            <button class="w-add-cart bg-[#fdee23] hover:bg-[#e6d61a] text-[#111] border border-slate-300 font-extrabold py-3 rounded-lg text-sm mt-2 w-full shadow-sm" onclick="addWainscotingToCart()">+ Masukkan ke Troli (Cart)</button>
        </div>

        <div id="visualContainer" class="hidden space-y-3">
            <div class="flex justify-between items-center">
                <label class="block font-medium text-slate-700 text-sm">Visual Dinding:</label>
                <button onclick="saveVisualToPhone()" class="bg-slate-800 hover:bg-slate-900 text-white text-xs px-3 py-1.5 rounded-lg transition shadow-sm font-medium">
                    📥 Save to Phone (.png)
                </button>
            </div>
            <div id="captureArea" class="w-full bg-white rounded-xl p-3 flex flex-col justify-between items-center border-2 border-slate-300 shadow-inner relative overflow-x-auto min-h-[280px]"></div>
        </div>
    </div>

    <script>
        const singlePrices = { "300x300": 30, "300x600": 40, "300x900": 50, "300x1200": 60, "300x1500": 70, "300x1800": 90, "300x2400": 110, "600x600": 50, "600x900": 60, "600x1200": 70, "600x1500": 90, "600x1800": 100, "600x2400": 130, "900x900": 70, "900x1200": 90, "900x1500": 100, "900x1800": 110, "900x2400": 140, "1200x1200": 100, "1200x1500": 110, "1200x1800": 130, "1200x2400": 150, "1500x1500": 130, "1500x1800": 140, "1500x2400": 160, "1800x1800": 150, "1800x2400": 190, "2400x2400": 210 };
        const doublePrices = { "300x300": 15, "300x600": 25, "300x900": 35, "300x1200": 45, "300x1500": 55, "300x1800": 65, "300x2400": 75, "600x600": 35, "600x900": 45, "600x1200": 55, "600x1500": 65, "600x1800": 75, "600x2400": 115, "900x900": 55, "900x1200": 65, "900x1500": 75, "900x1800": 85, "900x2400": 120, "1200x1200": 75, "1200x1500": 85, "1200x1800": 115, "1200x2400": 125, "1500x1500": 115, "1500x1800": 120, "1500x2400": 145, "1800x1800": 125, "1800x2400": 155, "2400x2400": 175 };

        function getFlexiblePrice(w, h, priceTable, defaultVal) {
            let key1 = `${w}x${h}`, key2 = `${h}x${w}`;
            if (priceTable[key1] !== undefined) return priceTable[key1];
            if (priceTable[key2] !== undefined) return priceTable[key2];
            return defaultVal;
        }

        function getCeilStandardSize(val) {
            let standards = [300, 600, 900, 1200, 1500, 1800, 2400];
            for (let i = 0; i < standards.length; i++) { if (val <= standards[i]) return standards[i]; }
            return 2400;
        }

        let lastCalculatedRecord = null;
        let lastTotalPriceNum = 0;

        function calculateWainscoting() {
            let wMm = parseFloat(document.getElementById('wallWidth').value) || 0;
            let hMm = parseFloat(document.getElementById('wallHeight').value) || 0;
            let style = document.getElementById('layoutStyle').value;
            let pattern = document.getElementById('boxPattern').value;
            let frameType = document.getElementById('frameType').value;
            let frameColor = document.getElementById('frameColor').value;

            if (wMm <= 0 || hMm <= 0) { alert('Sila masukkan ukuran dinding yang sah.'); return; }

            let bottomBoxHeight = 600, chairRailHeight = 70, totalGaps = 400;
            let topBoxHeight = hMm - bottomBoxHeight - chairRailHeight - totalGaps;
            if (topBoxHeight < 100) topBoxHeight = 300;

            let effectiveWidth = wMm, unitWidth = 0, boxWidths = [];
            if (pattern === '1:1') { effectiveWidth = wMm - 300; unitWidth = effectiveWidth / 2; boxWidths = [unitWidth, unitWidth]; }
            else if (pattern === '1:2:1') { effectiveWidth = wMm - 400; unitWidth = effectiveWidth / 4; boxWidths = [unitWidth, unitWidth * 2, unitWidth]; }
            else if (pattern === '1:1:2:1:1') { effectiveWidth = wMm - 600; unitWidth = effectiveWidth / 6; boxWidths = [unitWidth, unitWidth, unitWidth * 2, unitWidth, unitWidth]; }
            else if (pattern === '2:1:2:1:2') { effectiveWidth = wMm - 600; unitWidth = effectiveWidth / 6; boxWidths = [unitWidth * 2, unitWidth, unitWidth * 2, unitWidth, unitWidth * 2]; }
            else if (pattern === '1:2:1:2:1') { effectiveWidth = wMm - 600; unitWidth = effectiveWidth / 7; boxWidths = [unitWidth, unitWidth * 2, unitWidth, unitWidth * 2, unitWidth]; }
            else if (pattern === '1') { effectiveWidth = wMm - 200; boxWidths = [effectiveWidth]; }

            let totalPrice = 0, breakdownHtml = "", sizeCounts = {};

            boxWidths.forEach((bw) => {
                let roundedW = Math.round(bw);
                let stdW_Top = getCeilStandardSize(roundedW), stdH_Top = getCeilStandardSize(topBoxHeight);
                let keyTop = `${stdW_Top}x${stdH_Top}`;
                if (!sizeCounts[keyTop]) sizeCounts[keyTop] = { count: 0, w: roundedW, h: Math.round(topBoxHeight), stdW: stdW_Top, stdH: stdH_Top, type: 'Atas' };
                sizeCounts[keyTop].count += 1;

                if (style === 'with_chairrail') {
                    let stdH_Bot = getCeilStandardSize(bottomBoxHeight);
                    let keyBot = `${stdW_Top}x${stdH_Bot}`;
                    if (!sizeCounts[keyBot]) sizeCounts[keyBot] = { count: 0, w: roundedW, h: 600, stdW: stdW_Top, stdH: stdH_Bot, type: 'Bawah' };
                    sizeCounts[keyBot].count += 1;
                }
            });

            for (let key in sizeCounts) {
                let item = sizeCounts[key];
                let unitPrice = getFlexiblePrice(item.stdW, item.stdH, singlePrices, 60);
                if (frameType === 'double') unitPrice += getFlexiblePrice(item.stdW, item.stdH, doublePrices, 45);
                if (frameColor === 'gold') unitPrice += 5;
                let subTotal = unitPrice * item.count;
                totalPrice += subTotal;
                breakdownHtml += `<div class="flex justify-between"><span>Kotak ${item.type} (${item.w}x${item.h}mm) [${item.count} unit x RM ${unitPrice}]:</span> <span class="font-medium">RM ${subTotal}</span></div>`;
            }

            if (style === 'with_chairrail') {
                let chairRailSticks = Math.ceil((wMm * 1.10) / 2400);
                let chairRailTotalCost = chairRailSticks * 70;
                totalPrice += chairRailTotalCost;
                breakdownHtml += `<div class="flex justify-between text-amber-800 font-medium border-t pt-1"><span>Chair Rail [${chairRailSticks}btg x RM70]:</span> <span>RM ${chairRailTotalCost}</span></div>`;
            }

            lastTotalPriceNum = totalPrice;
            lastCalculatedRecord = {
                tajuk: "Pro Wainscoting",
                info: `Dinding: ${wMm}x${hMm}mm (${pattern})`,
                harga: "RM " + totalPrice.toFixed(2)
            };

            document.getElementById('priceBreakdown').innerHTML = breakdownHtml;
            document.getElementById('totalPrice').innerText = 'RM ' + totalPrice.toFixed(2);
            document.getElementById('resultContainer').classList.remove('hidden');

            let previewBox = document.getElementById('captureArea');
            previewBox.innerHTML = '';
            document.getElementById('visualContainer').classList.remove('hidden');

            let frameColorClass = (frameColor === 'gold') ? 'border-yellow-600 text-yellow-700' : 'border-slate-900 text-slate-900';
            let topRow = document.createElement('div');
            topRow.className = 'w-full flex justify-around items-center gap-1.5 px-1';
            topRow.style.height = Math.max(90, Math.round((topBoxHeight / hMm) * 240)) + 'px';

            boxWidths.forEach((bw) => {
                let boxEl = document.createElement('div');
                boxEl.className = `border-[3px] ${frameColorClass} bg-white rounded flex flex-col items-center justify-center text-[9px] font-bold relative shadow-xs`;
                boxEl.style.flexGrow = bw; boxEl.style.flexBasis = '0'; boxEl.style.height = '100%';
                boxEl.innerHTML = `<span class="bg-white/90 px-1 py-0.5 rounded text-slate-800">${Math.round(bw)} x ${Math.round(topBoxHeight)}mm</span>`;
                topRow.appendChild(boxEl);
            });
            previewBox.appendChild(topRow);
        }

        function addWainscotingToCart() {
            if (!lastCalculatedRecord) { alert("Sila buat pengiraan terlebih dahulu!"); return; }
            let cartData = JSON.parse(localStorage.getItem('diy_cart')) || [];
            cartData.push(lastCalculatedRecord);
            localStorage.setItem('diy_cart', JSON.stringify(cartData));

            let historyList = JSON.parse(localStorage.getItem('diy_calc_history')) || [];
            historyList.push(lastCalculatedRecord);
            localStorage.setItem('diy_calc_history', JSON.stringify(historyList));

            alert("Berjaya masukkan pengiraan Wainscoting ke dalam Troli!");
        }

        function saveVisualToPhone() {
            html2canvas(document.getElementById('captureArea'), { scale: 2 }).then(canvas => {
                let link = document.createElement('a');
                link.download = 'wainscoting.png'; link.href = canvas.toDataURL('image/png'); link.click();
            });
        }
    </script>

    <a href="../index.html" style="position: fixed; bottom: 20px; right: 20px; background: #fdee23; color: #111; padding: 12px 18px; border-radius: 30px; text-decoration: none; font-family: 'Inter', sans-serif; font-weight: 800; font-size: 14px; box-shadow: 0 4px 15px rgba(253,238,35,0.4); display: flex; align-items: center; gap: 6px; z-index: 9999; border: 1px solid #111;">
        <span>←</span> Menu Utama
    </a>
    <script>
        history.pushState(null, null, location.href);
        window.addEventListener('popstate', function () { window.location.href = '../index.html'; });
    </script>
</body>
</html>
