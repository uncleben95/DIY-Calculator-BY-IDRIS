<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>iPainter DIY Wainscoting Calculator</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Inter,Arial,sans-serif;
  background:#f5f7fa;
  color:#18212f
}

.container{
  max-width:1100px;
  margin:auto;
  padding:24px
}

.card{
  background:#fff;
  border:1px solid #e3e7ed;
  border-radius:18px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 8px 24px rgba(20,30,50,.06)
}

h1{
  margin:0 0 6px;
  font-size:28px
}

.sub{
  color:#697586;
  margin-bottom:20px
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px
}

label{
  font-size:13px;
  font-weight:700;
  color:#465466;
  display:block;
  margin-bottom:6px
}

input,select{
  width:100%;
  padding:12px;
  border:1px solid #d5dbe3;
  border-radius:10px;
  background:#fff;
  font-size:15px
}

button{
  border:0;
  border-radius:10px;
  padding:11px 15px;
  font-weight:700;
  cursor:pointer;
  background:#1f2937;
  color:#fff
}

button.secondary{
  background:#eef2f6;
  color:#243042
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:16px
}

.result{
  display:none
}

.price{
  font-size:32px;
  font-weight:800;
  margin:5px 0 14px
}

.muted{
  color:#6b7280;
  font-size:13px
}

/* =========================================================
   VISUAL — FIT INSIDE BROWSER, NO SCROLL
========================================================= */

.visual-wrap{
  width:100%;
  overflow:hidden;
  margin-top:18px
}

.wall-stage{
  width:100%;
  max-width:980px;
  margin:0 auto;
  display:flex;
  justify-content:center
}

/*
  IMPORTANT:
  The wall uses a real Width : Height aspect ratio.
  JavaScript calculates the exact ratio and sets height.
  max-height prevents the visual from becoming too tall.
*/

.wall{
  position:relative;
  width:100%;
  aspect-ratio:3000 / 2900;
  max-height:600px;
  background:#eee9df;
  border:5px solid #ffffff;
  box-shadow:
    inset 0 0 0 1px #d6d0c6,
    0 4px 16px rgba(0,0,0,.08);
  border-radius:6px;
  overflow:hidden
}

/* =========================================================
   WALL DIMENSIONS
========================================================= */

.wall::before{
  content:attr(data-width) " mm";
  position:absolute;
  top:-1px;
  left:50%;
  transform:translate(-50%,-100%);
  font-size:11px;
  font-weight:700;
  color:#697586;
  white-space:nowrap;
  pointer-events:none
}

.wall::after{
  content:attr(data-height) " mm";
  position:absolute;
  right:-7px;
  top:50%;
  transform:translate(100%,-50%) rotate(90deg);
  transform-origin:center;
  font-size:11px;
  font-weight:700;
  color:#697586;
  white-space:nowrap;
  pointer-events:none
}

/* =========================================================
   VISUAL ROWS
========================================================= */

.top-row,
.bottom-row,
.full-row{
  position:absolute;
  display:block;
}

/*
  Rows are NOT flex.
  Every panel is positioned using the actual calculated
  millimetre dimensions.
*/

.top-row{
  top:0;
}

.bottom-row{
  top:0;
}

.full-row{
  top:0;
}

/* =========================================================
   PANELS
========================================================= */

.panel{
  position:absolute;
  min-width:0;
  min-height:0;

  background:rgba(255,255,255,.12);

  /*
    Thick outer frame
  */
  border:5px solid #d8d0c3;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;
}

.panel.double{
  border:5px solid #d8d0c3
}

/*
  Thin inner frame
*/

.panel.double::after{
  content:"";
  position:absolute;
  left:12px;
  right:12px;
  top:12px;
  bottom:12px;

  border:2px solid #bcb3a5;

  pointer-events:none
}

.panel span{
  font-size:clamp(8px,1.15vw,13px);
  font-weight:700;
  color:#5a5147;
  text-align:center;
  line-height:1.25;
  z-index:2;
  white-space:nowrap;

  background:rgba(255,255,255,.72);
  padding:3px 5px;
  border-radius:4px
}

/* =========================================================
   CHAIR RAIL — EXACTLY 3 HORIZONTAL LINES
========================================================= */

.rail{
  position:absolute;
  left:0;
  right:0;

  height:70px;

  pointer-events:none
}

.rail-line{
  position:absolute;
  left:0;
  right:0;

  height:3px;

  background:#d8d0c3
}

.rail-line.line-1{
  top:8px
}

.rail-line.line-2{
  top:50%;
  transform:translateY(-50%)
}

.rail-line.line-3{
  bottom:8px
}

.rail-label{
  position:absolute;
  right:8px;
  top:50%;
  transform:translateY(-50%);

  font-size:9px;
  font-weight:700;
  color:#5a5147;

  background:rgba(255,255,255,.8);
  padding:3px 5px;
  border-radius:4px
}

/* =========================================================
   SPECS / PRICE
========================================================= */

.specgrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:15px
}

.spec{
  background:#f7f8fa;
  border-radius:12px;
  padding:12px
}

.spec b{
  display:block;
  font-size:12px;
  color:#6b7280
}

.spec strong{
  font-size:17px
}

.boxlist{
  margin-top:14px
}

.boxitem{
  padding:12px;
  border:1px solid #e6e9ee;
  border-radius:12px;
  margin:8px 0;
  background:#fafbfc;
  line-height:1.55
}

.tag{
  display:inline-block;
  padding:4px 8px;
  border-radius:999px;
  background:#edf2f7;
  font-size:11px;
  font-weight:800;
  margin-bottom:6px
}

.history-item{
  border-top:1px solid #eee;
  padding:10px 0
}

.empty{
  color:#8a94a3
}

.notice{
  background:#f0f7ff;
  border:1px solid #d7eaff;
  padding:12px;
  border-radius:12px;
  font-size:13px;
  color:#40556d
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

  .container{
    padding:14px
  }

  .grid,
  .specgrid{
    grid-template-columns:1fr
  }

  h1{
    font-size:23px
  }

  .wall{
    /*
      Still uses real aspect ratio.
      No horizontal scrolling.
    */
    width:100%;
    max-height:none;
    border-width:3px
  }

  .panel{
    border-width:3px
  }

  .panel.double{
    border-width:3px
  }

  .panel.double::after{
    left:7px;
    right:7px;
    top:7px;
    bottom:7px;
    border-width:1.5px
  }

  .panel span{
    font-size:7px;
    padding:2px 3px
  }

  .rail{
    height:70px
  }

  .rail-line{
    height:2px
  }

  .rail-label{
    display:none
  }
}
</style>
</head>

<body>

<div class="container">

<!-- =======================================================
     CALCULATOR
======================================================= -->

<div class="card">

<h1>iPainter DIY Wainscoting Calculator</h1>

<div class="sub">
Custom sizing, material pricing and downloadable visual design.
</div>

<div class="grid">

<div>
<label>Wall Width (mm)</label>
<input id="wallWidth" type="number" value="3000" min="300">
</div>

<div>
<label>Wall Height (mm)</label>
<input id="wallHeight" type="number" value="2900" min="300">
</div>

<div>
<label>Layout Style</label>

<select id="layoutStyle">

<option value="with_chairrail">
With Chair Rail
</option>

<option value="without_chairrail">
Without Chair Rail
</option>

<option value="full_height">
Full Height
</option>

</select>
</div>

<div>
<label>Box Pattern</label>

<select id="pattern">

<option value="1:1">
1:1
</option>

<option value="1:2:1">
1:2:1
</option>

<option value="1:1:2:1:1">
1:1:2:1:1
</option>

<option value="2:1:2:1:2">
2:1:2:1:2
</option>

<option value="1:2:1:2:1">
1:2:1:2:1
</option>

<option value="single">
Single
</option>

</select>
</div>

<div>
<label>Frame Type</label>

<select id="frameType">

<option value="single">
Single Frame
</option>

<option value="double">
Double Frame
</option>

</select>
</div>

<div>
<label>Frame Colour</label>

<select id="frameColour">

<option value="standard">
Standard
</option>

<option value="gold">
Gold (+RM5 / logical box)
</option>

</select>
</div>

</div>

<div class="actions">

<button onclick="calculate()">
Calculate
</button>

<button class="secondary" onclick="resetForm()">
Reset
</button>

</div>

</div>


<!-- =======================================================
     RESULT
======================================================= -->

<div class="card result" id="result">

<h2 id="resultTitle">
Design Result
</h2>

<div class="price" id="totalPrice">
RM0
</div>

<div id="summary" class="muted"></div>


<!-- VISUAL -->

<div class="visual-wrap">

<div class="wall-stage">

<div id="wallVisual" class="wall"></div>

</div>

</div>


<div id="specs" class="specgrid"></div>

<div id="boxDetails" class="boxlist"></div>


<div class="actions">

<button onclick="downloadVisualDesign()">
Download Visual Design PNG
</button>

<button class="secondary" onclick="addToCart()">
Add to Cart
</button>

<button class="secondary" onclick="saveHistory()">
Save History
</button>

</div>

</div>


<!-- =======================================================
     HISTORY
======================================================= -->

<div class="card">

<h2>
History
</h2>

<div id="history">

<div class="empty">
No saved calculation.
</div>

</div>

<div class="actions">

<button class="secondary" onclick="clearHistory()">
Clear History
</button>

</div>

</div>

</div>


<script>

/* =========================================================
   PRICE TABLES
========================================================= */

const singlePrices={

"300x300":30,
"300x600":40,
"300x900":50,
"300x1200":60,
"300x1500":70,
"300x1800":90,
"300x2400":110,

"600x600":50,
"600x900":60,
"600x1200":70,
"600x1500":90,
"600x1800":100,
"600x2400":130,

"900x900":70,
"900x1200":90,
"900x1500":100,
"900x1800":110,
"900x2400":140,

"1200x1200":100,
"1200x1500":110,
"1200x1800":130,
"1200x2400":150,

"1500x1500":130,
"1500x1800":140,
"1500x2400":160,

"1800x1800":150,
"1800x2400":190,

"2400x2400":210

};


const doublePrices={

"300x300":15,
"300x600":25,
"300x900":35,
"300x1200":45,
"300x1500":55,
"300x1800":65,
"300x2400":75,

"600x600":35,
"600x900":45,
"600x1200":55,
"600x1500":65,
"600x1800":75,
"600x2400":115,

"900x900":55,
"900x1200":65,
"900x1500":75,
"900x1800":85,
"900x2400":120,

"1200x1200":75,
"1200x1500":85,
"1200x1800":115,
"1200x2400":125,

"1500x1500":115,
"1500x1800":120,
"1500x2400":145,

"1800x1800":125,
"1800x2400":155,

"2400x2400":175

};


const innerFramePrices={

"300x300":15,
"300x600":25,
"300x900":35,
"300x1200":45,
"300x1800":65,
"300x2400":75,

"600x600":35,
"600x900":45,
"600x1200":55,
"600x1800":75,
"600x2400":115,

"900x900":55,
"900x1200":65,
"900x1500":75,
"900x1800":85,
"900x2400":120,

"1200x1200":75,
"1200x1500":85,
"1200x1800":15,
"1200x2400":125,

"1500x1500":115,
"1500x1800":120,
"1500x2400":145,

"1800x1800":125,
"1800x2400":155,

"2400x2400":175

};


const standardSizes=[
300,
600,
900,
1200,
1500,
1800,
2400
];


const patternDefinitions={

"1:1":{
ratios:[1,1],
gaps:3
},

"1:2:1":{
ratios:[1,2,1],
gaps:4
},

"1:1:2:1:1":{
ratios:[1,1,2,1,1],
gaps:6
},

"2:1:2:1:2":{
ratios:[2,1,2,1,2],
gaps:6
},

"1:2:1:2:1":{
ratios:[1,2,1,2,1],
gaps:6
},

"single":{
ratios:[1],
gaps:2
}

};


let lastCalculation=null;


/* =========================================================
   PRICE HELPERS
========================================================= */

function ceilStandardSize(v){

return standardSizes.find(
s=>s>=v
)||null

}


function getPrice(w,h,table){

const a=
table[
Math.round(w)+"x"+Math.round(h)
];

const b=
table[
Math.round(h)+"x"+Math.round(w)
];

return a!=null
?a
:b!=null
?b
:null

}


function splitDimension(value){

let rem=
Math.round(value);

let out=[];

while(rem>2400){

out.push({
actual:2400,
standard:2400
});

rem-=2400

}

if(rem>0){

const s=
ceilStandardSize(rem);

if(!s)return null;

out.push({
actual:rem,
standard:s
});

}

return out

}


function calculateMaterialCombination(
width,
height,
table
){

const wp=
splitDimension(width);

const hp=
splitDimension(height);

if(!wp||!hp)return null;

let total=0;

let pieces=[];

for(const w of wp){

for(const h of hp){

const price=
getPrice(
w.standard,
h.standard,
table
);

if(price==null)return null;

total+=price;

pieces.push({

actualWidth:w.actual,

actualHeight:h.actual,

priceWidth:w.standard,

priceHeight:h.standard,

price

});

}

}

return {
total,
pieces
}

}


/* =========================================================
   DOUBLE FRAME PRICING
========================================================= */

function calculateDoubleBoxPricing(w,h){

const outer=
calculateMaterialCombination(
w,
h,
doublePrices
);

if(!outer)return null;

let innerTotal=0;

let innerPieces=[];

for(const p of outer.pieces){

const iw=
Math.max(
300,
p.actualWidth-180
);

const ih=
Math.max(
300,
p.actualHeight-180
);

const inner=
calculateMaterialCombination(
iw,
ih,
innerFramePrices
);

if(!inner)return null;

innerTotal+=inner.total;

innerPieces.push({

outerPiece:p,

innerWidth:iw,

innerHeight:ih,

pieces:inner.pieces

});

}

return {

outer,

inner:{
total:innerTotal,
pieces:innerPieces
},

total:
outer.total+
innerTotal

}

}


/* =========================================================
   BUILD BOXES
========================================================= */

function buildBoxes(width,height){

const layout=
document.getElementById(
"layoutStyle"
).value;

const pat=
patternDefinitions[
document.getElementById(
"pattern"
).value
];

const full=
layout==="full_height";


if(full){

return {

topHeight:
height-200,

bottomHeight:0,

topWidths:
getWidths(width,pat),

bottomWidths:[],

rail:0

}

}


const topHeight=
layout==="with_chairrail"
?height-1070
:height-1000;


return {

topHeight,

bottomHeight:600,

topWidths:
getWidths(width,pat),

bottomWidths:
getWidths(width,pat),

rail:
layout==="with_chairrail"
?70
:0

}

}


function getWidths(width,pat){

const available=
width-
pat.gaps*100;

const sum=
pat.ratios.reduce(
(a,b)=>a+b,
0
);

const unit=
available/sum;

return pat.ratios.map(
r=>unit*r
)

}


/* =========================================================
   PRICE BOX
========================================================= */

function priceBox(
w,
h,
type,
colour
){

const base=
type==="double"
?
calculateDoubleBoxPricing(w,h)
:
calculateMaterialCombination(
w,
h,
singlePrices
);

if(!base)return null;

return {

base,

extra:
colour==="gold"
?5
:0,

total:
base.total+
(
colour==="gold"
?5
:0
)

}

}


/* =========================================================
   CALCULATE
========================================================= */

function calculate(){

try{

const W=
+document.getElementById(
"wallWidth"
).value;

const H=
+document.getElementById(
"wallHeight"
).value;

const layout=
document.getElementById(
"layoutStyle"
).value;

const type=
document.getElementById(
"frameType"
).value;

const colour=
document.getElementById(
"frameColour"
).value;


if(
W<300||
H<300
){

alert(
"Minimum wall dimension is 300mm."
);

return

}


const b=
buildBoxes(W,H);


if(b.topHeight<=0){

alert(
"Wall height is too small for this layout."
);

return

}


const boxes=[];

let total=0;


/* TOP */

b.topWidths.forEach(
(w,i)=>{

const p=
priceBox(
w,
b.topHeight,
type,
colour
);

if(!p)throwPrice();

boxes.push({

row:"Top",

index:i+1,

w,

h:b.topHeight,

p

});

total+=p.total

}
);


/* BOTTOM */

b.bottomWidths.forEach(
(w,i)=>{

const p=
priceBox(
w,
b.bottomHeight,
type,
colour
);

if(!p)throwPrice();

boxes.push({

row:"Bottom",

index:i+1,

w,

h:b.bottomHeight,

p

});

total+=p.total

}
);


/* CHAIR RAIL */

let railQty=0;

let railTotal=0;

if(layout==="with_chairrail"){

railQty=
Math.ceil(
(W*1.10)/2400
);

railTotal=
railQty*70;

total+=railTotal

}


lastCalculation={

W,

H,

layout,

type,

colour,

boxes,

railQty,

railTotal,

total,

b

};


renderResult();

}


/* =========================================================
   PRICE ERROR
========================================================= */

function throwPrice(){

throw new Error(
"One or more calculated frame sizes are not available in the pricing database."
);

}


/* =========================================================
   RESULT
========================================================= */

function renderResult(){

const c=
lastCalculation;

const layoutName=
c.layout==="full_height"
?
"Full Height"
:
c.layout==="with_chairrail"
?
"With Chair Rail"
:
"Without Chair Rail";


document.getElementById(
"result"
).style.display="block";


document.getElementById(
"resultTitle"
).textContent=
(
c.type==="double"
?
"Double Frame"
:
"Single Frame"
)
+
" • "
+
layoutName;


document.getElementById(
"totalPrice"
).textContent=
"RM"+
c.total.toLocaleString(
"en-MY",
{
minimumFractionDigits:2
}
);


document.getElementById(
"summary"
).textContent=
`Wall ${c.W} × ${c.H} mm • ${
c.colour==="gold"
?"Gold"
:"Standard"
} • Pattern ${
document.getElementById("pattern").value
}`;


/* SPECS */

document.getElementById(
"specs"
).innerHTML=`

<div class="spec">

<b>
${
c.layout==="full_height"
?
"Total Box Height"
:
"Top Box Height"
}
</b>

<strong>
${Math.round(c.b.topHeight)}mm
</strong>

</div>


<div class="spec">

<b>
${
c.layout==="full_height"
?
"Bottom Gap"
:
"Bottom Box Height"
}
</b>

<strong>
${
c.layout==="full_height"
?
"100mm"
:
c.b.bottomHeight+"mm"
}
</strong>

</div>


<div class="spec">

<b>
Chair Rail
</b>

<strong>
${
c.layout==="with_chairrail"
?
c.b.rail+"mm"
:
"N/A"
}
</strong>

</div>

`;


/* VISUAL */

renderVisual();


/* PRICE BREAKDOWN */

document.getElementById(
"boxDetails"
).innerHTML=

c.boxes
.map(
x=>boxHtml(x)
)
.join("")

+

(
c.railQty
?

`

<div class="boxitem">

<span class="tag">
CHAIR RAIL
</span>

<br>

<b>Quantity:</b>
${c.railQty} × 2400mm pieces

<br>

<b>Price:</b>
RM${c.railTotal.toFixed(2)}

</div>

`

:
""

);

}


/* =========================================================
   BOX PRICE DETAIL
========================================================= */

function boxHtml(x){

const b=
x.p.base;


if(
x.p &&
lastCalculation.type==="double"
){

const outer=
b.outer.pieces
.map(
p=>
`${p.priceWidth}×${p.priceHeight}`
)
.join(" + ");


const inn=
b.inner.pieces
.map(
g=>
g.pieces
.map(
p=>
`${p.priceWidth}×${p.priceHeight}`
)
.join(" + ")
)
.join(" | ");


return `

<div class="boxitem">

<span class="tag">
${x.row} BOX ${x.index}
</span>

<br>

<b>Actual:</b>
${Math.round(x.w)}×${Math.round(x.h)}mm

<br>

<b>Outer:</b>
${outer}
•
RM${b.outer.total}

<br>

<b>Inner:</b>
${inn}
•
RM${b.inner.total}

<br>

<b>
${lastCalculation.colour==="gold"
?"Gold / Premium (+RM5)"
:"Frame Total"}
:
</b>

RM${x.p.total.toFixed(2)}

</div>

`;

}


const pieces=
b.pieces
.map(
p=>
`${p.priceWidth}×${p.priceHeight}`
)
.join(" + ");


return `

<div class="boxitem">

<span class="tag">
${x.row} BOX ${x.index}
</span>

<br>

<b>Actual:</b>
${Math.round(x.w)}×${Math.round(x.h)}mm

<br>

<b>Material:</b>
${pieces}
•
RM${b.total}

${
lastCalculation.colour==="gold"
?
`
<br>
<b>Gold / Premium:</b>
RM5.00
`
:
""
}

<br>

<b>Total:</b>
RM${x.p.total.toFixed(2)}

</div>

`;

}


/* =========================================================
   VISUAL ENGINE
========================================================= */

function renderVisual(){

const c=
lastCalculation;

const v=
document.getElementById(
"wallVisual"
);


/*
  Set wall ratio based on REAL dimensions.
*/

v.style.aspectRatio=
`${c.W} / ${c.H}`;

v.dataset.width=
c.W;

v.dataset.height=
c.H;

v.className=
"wall";


/*
  Clear previous drawing.
*/

v.innerHTML="";


/*
  Wall coordinate system.
  We use percentages calculated from actual mm.
*/

const wallW=c.W;
const wallH=c.H;


/* ---------------------------------------------------------
   Convert mm → percentage
--------------------------------------------------------- */

function X(mm){
return (
mm/wallW
)*100
}

function Y(mm){
return (
mm/wallH
)*100
}


/* ---------------------------------------------------------
   Create exact row
--------------------------------------------------------- */

function createRow(
className,
boxes,
topMM,
heightMM
){

const row=
document.createElement("div");

row.className=
className;

row.style.left="0%";
row.style.top=Y(topMM)+"%";
row.style.width="100%";
row.style.height=Y(heightMM)+"%";

v.appendChild(row);


/*
  Every box is absolutely positioned.

  Pattern:
  100mm left gap
  box
  100mm gap
  box
  ...
  100mm right gap
*/

let xMM=100;


boxes.forEach(
(box,index)=>{

const p=
document.createElement("div");

p.className=
"panel"+
(
c.type==="double"
?
" double"
:
""
);


/*
  Exact calculated position.
*/

p.style.left=
X(xMM)+"%";

p.style.width=
X(box.w)+"%";

p.style.top="0%";

p.style.height="100%";


p.innerHTML=
`
<span>
${Math.round(box.w)}
×
${Math.round(box.h)}
mm
</span>
`;


row.appendChild(p);


/*
  Move to next box:
  current width + exact 100mm gap.
*/

xMM+=
box.w+
100;

}

);

}


/* =========================================================
   FULL HEIGHT
========================================================= */

if(c.layout==="full_height"){

createRow(

"full-row",

c.boxes,

100,

c.b.topHeight

);

return;

}


/* =========================================================
   NORMAL TOP BOXES
========================================================= */

createRow(

"top-row",

c.boxes.filter(
x=>x.row==="Top"
),

100,

c.b.topHeight

);


/* =========================================================
   CHAIR RAIL
========================================================= */

if(c.layout==="with_chairrail"){

const rail=
document.createElement("div");

rail.className="rail";


const railTop=
100+
c.b.topHeight+
100;


rail.style.top=
Y(railTop)+"%";

rail.style.height=
Y(70)+"%";


rail.innerHTML=`

<div class="rail-line line-1"></div>

<div class="rail-line line-2"></div>

<div class="rail-line line-3"></div>

<div class="rail-label">
70 mm
</div>

`;


v.appendChild(rail);

}


/* =========================================================
   BOTTOM BOXES
========================================================= */

let bottomTop;


/*
  With chair rail:

  100 top gap
  top box
  100 gap
  70 rail
  100 gap
  bottom box
  100 bottom gap
*/

if(c.layout==="with_chairrail"){

bottomTop=
100+
c.b.topHeight+
100+
70+
100;

}

/*
  Without chair rail:

  100 top gap
  top box
  200 middle separation
  bottom box
  100 bottom gap
*/

else{

bottomTop=
100+
c.b.topHeight+
200;

}


createRow(

"bottom-row",

c.boxes.filter(
x=>x.row==="Bottom"
),

bottomTop,

600

);

}


/* =========================================================
   DOWNLOAD VISUAL DESIGN
========================================================= */

function downloadVisualDesign(){

if(!lastCalculation){

alert(
"Please calculate first."
);

return

}


const c=
lastCalculation;


const canvas=
document.createElement(
"canvas"
);

const ctx=
canvas.getContext("2d");


/*
  Fixed export canvas.
  This is only for the downloaded image.
*/

const S=1800;

canvas.width=S;

canvas.height=
c.layout==="full_height"
?
1200
:
1100;


ctx.fillStyle=
"#f5f7fa";

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);


/* TITLE */

ctx.fillStyle=
"#18212f";

ctx.font=
"bold 38px Arial";

ctx.fillText(
"Wainscoting Visual Design",
60,
60
);


ctx.font=
"20px Arial";

ctx.fillStyle=
"#667085";

ctx.fillText(

`${c.W} × ${c.H} mm • ${
c.type==="double"
?
"Double Frame"
:
"Single Frame"
} • ${
c.layout==="full_height"
?
"Full Height"
:
c.layout==="with_chairrail"
?
"With Chair Rail"
:
"Without Chair Rail"
}`,

60,
95

);


/*
  Drawing wall.
*/

const wallX=80;

const wallY=140;

const wallW=1640;

const wallH=
c.layout==="full_height"
?
980
:
880;


/*
  Actual ratio fit.
*/

const ratio=
c.W/c.H;

let drawW=wallW;

let drawH=
drawW/ratio;


if(drawH>wallH){

drawH=wallH;

drawW=
drawH*ratio;

}


const dx=
wallX+
(wallW-drawW)/2;

const dy=
wallY+
(wallH-drawH)/2;


/* WALL */

ctx.fillStyle=
"#eee9df";

ctx.fillRect(
dx,
dy,
drawW,
drawH
);

ctx.strokeStyle=
"#d6d0c6";

ctx.lineWidth=2;

ctx.strokeRect(
dx,
dy,
drawW,
drawH
);


/* MM → PX */

const pxPerMM=
drawW/c.W;


function pxX(mm){
return dx+
mm*pxPerMM
}


function pxY(mm){
return dy+
mm*pxPerMM
}


/* DRAW PANEL */

function drawPanel(
box,
topMM
){

const x=
pxX(100);

let currentX=
x;


/*
  Need actual sequence position.
*/

return currentX;

}


/*
  Draw rows exactly.
*/

function drawBoxes(
arr,
topMM,
heightMM
){

let currentXMM=100;

arr.forEach(
box=>{

const x=
pxX(currentXMM);

const y=
pxY(topMM);

const w=
box.w*pxPerMM;

const h=
heightMM*pxPerMM;


/* fill */

ctx.fillStyle=
"#eee9df";

ctx.fillRect(
x,
y,
w,
h
);


/* outer frame */

ctx.strokeStyle=
"#d8d0c3";

ctx.lineWidth=
Math.max(
4,
6*pxPerMM
);

ctx.strokeRect(
x,
y,
w,
h
);


/* inner frame */

if(c.type==="double"){

ctx.strokeStyle=
"#bcb3a5";

ctx.lineWidth=2;

ctx.strokeRect(
x+12,
y+12,
w-24,
h-24
);

}


/* label */

ctx.fillStyle=
"#5a5147";

ctx.font=
"bold 17px Arial";

ctx.textAlign=
"center";

ctx.textBaseline=
"middle";

ctx.fillText(

`${Math.round(box.w)} × ${Math.round(box.h)} mm`,

x+w/2,
y+h/2

);


currentXMM+=
box.w+
100;

}

);


/*
  reset text alignment
*/

ctx.textAlign=
"left";

ctx.textBaseline=
"alphabetic";

}


/* FULL HEIGHT */

if(c.layout==="full_height"){

drawBoxes(
c.boxes,
100,
c.b.topHeight
);

}


/* NORMAL */

else{

drawBoxes(

c.boxes.filter(
x=>x.row==="Top"
),

100,

c.b.topHeight

);


/*
  Chair rail.
*/

if(c.layout==="with_chairrail"){

const railTop=
100+
c.b.topHeight+
100;

const ry=
pxY(railTop);

const railHeight=
70*pxPerMM;


/*
  3 lines
*/

ctx.strokeStyle=
"#d8d0c3";

ctx.lineWidth=
4;

[8,35,62].forEach(
offset=>{

ctx.beginPath();

ctx.moveTo(
dx,
ry+
offset*pxPerMM
);

ctx.lineTo(
dx+drawW,
ry+
offset*pxPerMM
);

ctx.stroke();

}
);

}


/*
  Bottom.
*/

const bottomTop=
c.layout==="with_chairrail"

?

100+
c.b.topHeight+
100+
70+
100

:

100+
c.b.topHeight+
200;


drawBoxes(

c.boxes.filter(
x=>x.row==="Bottom"
),

bottomTop,

600

);

}


/* FOOTER */

ctx.fillStyle=
"#667085";

ctx.font=
"16px Arial";

ctx.fillText(
"Visual reference • Actual dimensions shown inside each box.",
60,
canvas.height-35
);


canvas.toBlob(
blob=>{

const a=
document.createElement("a");

a.href=
URL.createObjectURL(blob);

a.download=
`wainscoting-${c.W}x${c.H}-${c.type}.png`;

a.click();

setTimeout(
()=>URL.revokeObjectURL(a.href),
1000
);

},
"image/png"
);

}

function saveHistory(){

if(!lastCalculation)
return;


let h=[];

try{

h=
JSON.parse(
localStorage.getItem(
"ipainter_wains_history"
)||"[]"
);

}
catch(e){}


h.unshift({

time:
new Date().toLocaleString(
"en-MY"
),

...lastCalculation

});


h=
h.slice(0,20);


localStorage.setItem(
"ipainter_wains_history",
JSON.stringify(h)
);


renderHistory();

}


function renderHistory(){

let h=[];

try{

h=
JSON.parse(
localStorage.getItem(
"ipainter_wains_history"
)||"[]"
);

}
catch(e){}


document.getElementById(
"history"
).innerHTML=

h.length

?

h.map(

`

<div class="history-item">

<b>
${x.W}×${x.H}mm
</b>

•

${x.type}

•

${x.layout}

RM${x.total.toFixed(2)}

}
